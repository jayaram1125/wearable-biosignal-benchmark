name: heart-rate benchmark
on:
  workflow_dispatch:
    inputs:
      method: { description: "spectral | beliefppg", default: "spectral" }
      subjects: { description: "comma-separated subset, blank = all 15", default: "" }
  push:
    tags: ["v*"]
defaults:
  run:
    working-directory: heart-rate-prediction-benchmark
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e '.[dev]'
      - run: pytest -q
  benchmark:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e '.[dev]'
      - name: baseline package
        if: ${{ github.event.inputs.method == 'beliefppg' }}
        run: pip install beliefppg
      - name: cache compact dataset
        id: cache
        uses: actions/cache@v4
        with: { path: heart-rate-prediction-benchmark/datasets/PPG_FieldStudy, key: ppg-dalia-npz-v1 }
      - name: download and convert
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p datasets && cd datasets
          curl -L -o ppg_dalia.zip "https://archive.ics.uci.edu/static/public/495/ppg+dalia.zip"
          unzip -q -o ppg_dalia.zip && rm ppg_dalia.zip && cd ..
          python -m heart_rate.prepare_dalia --zip datasets/data.zip --out datasets/PPG_FieldStudy
          rm -f datasets/data.zip
      - name: run
        run: |
          ARGS="--config configs/hr_dalia.yaml --method ${{ github.event.inputs.method || 'spectral' }}"
          if [ -n "${{ github.event.inputs.subjects }}" ]; then ARGS="$ARGS --subjects ${{ github.event.inputs.subjects }}"; fi
          python -m heart_rate.run $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: hr-results-${{ github.run_id }}
          path: |
            heart-rate-prediction-benchmark/results/*
            heart-rate-prediction-benchmark/logs/*.json
      - name: commit results
        run: |
          git config user.name "benchmark-bot" && git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add results logs && git commit -m "results: heart-rate ${{ github.event.inputs.method || 'spectral' }} run ${{ github.run_id }}" || echo "nothing to commit"
          git push
