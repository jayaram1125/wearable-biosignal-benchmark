[project]
name = "wearable-biosignal-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for wrist-PPG heart-rate and research-grade cuffless blood-pressure estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3", "pyyaml>=6.0", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
papagei = ["torch>=2.1"]
baselines = ["kid-ppg", "beliefppg"]
bp = ["wfdb>=4.1"]

[tool.setuptools]
packages = ["common", "heart_rate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
